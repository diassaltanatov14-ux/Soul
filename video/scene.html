<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.018);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);

// lights
scene.add(new THREE.HemisphereLight(0x8899ff, 0x110022, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 10, 7); scene.add(key);
const rim = new THREE.PointLight(0xff5a1f, 40, 30); rim.position.set(-6, 4, -4); scene.add(rim);

// floor grid
const grid = new THREE.GridHelper(80, 80, 0x3a3aff, 0x1a1a55);
grid.material.transparent = true; grid.material.opacity = 0.8; scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x070818, metalness: 0.8, roughness: 0.35, envMapIntensity: 0.08 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01; scene.add(floor);

// deterministic random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// candlestick data: upward trend with noise
const N = 28, candles = [];
let price = 1.0;
for (let i = 0; i < N; i++) {
  const open = price;
  const drift = 0.13 + (rnd() - 0.5) * 0.55;
  const close = Math.max(0.3, open + drift);
  const hi = Math.max(open, close) + rnd() * 0.3;
  const lo = Math.min(open, close) - rnd() * 0.3;
  candles.push({ open, close, hi, lo }); price = close;
}
const green = new THREE.MeshStandardMaterial({ color: 0x19ff8c, emissive: 0x0bd46a, emissiveIntensity: 0.35, metalness: 0.3, roughness: 0.3 });
const red = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0xd41030, emissiveIntensity: 0.35, metalness: 0.3, roughness: 0.3 });
const SP = 0.55, X0 = -(N - 1) * SP / 2;
const group = new THREE.Group(); scene.add(group);
const bodyGeo = new THREE.BoxGeometry(0.4, 1, 0.4), wickGeo = new THREE.BoxGeometry(0.05, 1, 0.05);
candles.forEach((c, i) => {
  const m = c.close >= c.open ? green : red;
  const b = new THREE.Mesh(bodyGeo, m), w = new THREE.Mesh(wickGeo, m);
  const g = new THREE.Group(); g.add(b, w);
  b.scale.y = Math.max(0.06, Math.abs(c.close - c.open)); b.position.y = (c.open + c.close) / 2;
  w.scale.y = c.hi - c.lo; w.position.y = (c.hi + c.lo) / 2;
  g.position.x = X0 + i * SP; group.add(g); c.g = g;
});

// glowing trend line through closes
const pts = candles.map((c, i) => new THREE.Vector3(X0 + i * SP, c.close, 0.45));
const curve = new THREE.CatmullRomCurve3(pts);
const tubeGeo = new THREE.TubeGeometry(curve, 400, 0.035, 8, false);
const tubeMat = new THREE.MeshBasicMaterial({ color: 0xffa010 });
const tube = new THREE.Mesh(tubeGeo, tubeMat); scene.add(tube);
const totalIdx = tubeGeo.index.count;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
scene.add(head);

// arrow up
const arrow = new THREE.Group();
const aMat = new THREE.MeshStandardMaterial({ color: 0x19ff8c, emissive: 0x19ff8c, emissiveIntensity: 1.2 });
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.6, 32), aMat);
const tip = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.8, 32), aMat); tip.position.y = 1.2;
arrow.add(shaft, tip); scene.add(arrow);

// coins
const coinMat = new THREE.MeshStandardMaterial({ color: 0xffc83a, metalness: 1, roughness: 0.25, emissive: 0x332000, emissiveIntensity: 0.3 });
const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.08, 48);
const coins = [];
for (let i = 0; i < 14; i++) {
  const c = new THREE.Mesh(coinGeo, coinMat);
  c.userData = { a: rnd() * Math.PI * 2, r: 4 + rnd() * 4, y: 1.5 + rnd() * 4, s: 0.4 + rnd() * 0.8, sp: 0.5 + rnd() };
  scene.add(c); coins.push(c);
}

// particles
const pg = new THREE.BufferGeometry(); const pp = [];
for (let i = 0; i < 1500; i++) pp.push((rnd() - 0.5) * 60, rnd() * 20, (rnd() - 0.5) * 60);
pg.setAttribute('position', new THREE.Float32BufferAttribute(pp, 3));
const stars = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x8fa8ff, size: 0.06 })); scene.add(stars);

// text planes via canvas
function textPlane(lines, w, h, pxW) {
  const cv = document.createElement('canvas'); cv.width = pxW; cv.height = Math.round(pxW * h / w);
  const x = cv.getContext('2d'); x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach(l => {
    x.font = l.font; x.shadowColor = l.glow; x.shadowBlur = 30;
    const grd = x.createLinearGradient(0, 0, cv.width, 0);
    l.colors.forEach((c, i) => grd.addColorStop(i / (l.colors.length - 1), c));
    x.fillStyle = grd; x.fillText(l.text, cv.width / 2, cv.height * l.y);
  });
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }));
  scene.add(m); return m;
}
const title = textPlane([
  { text: 'ТРЕЙДИНГ', font: 'bold 230px DejaVu Sans', colors: ['#ffd36b', '#ff7a1a', '#ffd36b'], glow: '#ff6a00', y: 0.33 },
  { text: 'ДЛЯ НАЧИНАЮЩИХ', font: 'bold 120px DejaVu Sans', colors: ['#ffffff', '#bfe9ff'], glow: '#3a8bff', y: 0.68 },
], 9, 3.4, 2048);
const sub = textPlane([
  { text: 'Учись  •  Анализируй  •  Торгуй с умом', font: '64px DejaVu Sans', colors: ['#9fffd0', '#ffffff', '#9fffd0'], glow: '#19ff8c', y: 0.5 },
], 9, 0.8, 2048);

// post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.5, 0.6);
composer.addPass(bloom); composer.addPass(new OutputPass());

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

export const DURATION = 14;
window.renderAt = (t) => {
  // candles grow in, 0.3s → 5.5s
  candles.forEach((c, i) => {
    const k = ease(seg(t, 0.3 + i * 0.17, 0.9 + i * 0.17));
    c.g.scale.set(1, Math.max(0.001, k), 1);
    c.g.visible = k > 0.001;
  });
  // trend line draws 1.0 → 6.0
  const lk = seg(t, 1.0, 6.0);
  tubeGeo.setDrawRange(0, Math.floor(totalIdx * lk / 3) * 3);
  const hp = curve.getPoint(Math.max(0.001, lk)); head.position.copy(hp);
  head.visible = lk > 0 && lk < 1; head.scale.setScalar(1 + 0.3 * Math.sin(t * 12));

  // arrow rises 5.5 → 7.5
  const ak = ease(seg(t, 5.5, 7.5));
  arrow.position.set(X0 + N * SP + 0.6, lerp(-3, price + 0.2, ak), 0);
  arrow.rotation.y = t * 1.5; arrow.visible = ak > 0;

  // coins
  const ck = ease(seg(t, 4.5, 7));
  coins.forEach(c => {
    const u = c.userData, a = u.a + t * u.sp * 0.6;
    c.position.set(Math.cos(a) * u.r, u.y + Math.sin(t * u.sp + u.a) * 0.4 + (1 - ck) * 12, Math.sin(a) * u.r - 2);
    c.rotation.set(Math.PI / 2 + Math.sin(t + u.a) * 0.4, t * u.sp * 3, 0);
    c.scale.setScalar(u.s);
  });
  stars.rotation.y = t * 0.02;
  rim.intensity = 40 + 15 * Math.sin(t * 2);

  // camera path
  const P1 = new THREE.Vector3(X0 - 2, 0.6, 3.2), L1 = new THREE.Vector3(X0 + 2, 1, 0);           // low start at first candle
  const P2 = new THREE.Vector3(2, 3.5, 6.5), L2 = new THREE.Vector3(1, 2.2, 0);                 // fly along
  const L3 = new THREE.Vector3(0, 2.6, 0);
  let pos = new THREE.Vector3(), look = new THREE.Vector3();
  if (t < 6) {
    const k = ease(seg(t, 0, 6));
    pos.lerpVectors(P1, P2, k); pos.y += Math.sin(k * Math.PI) * 0.8; look.lerpVectors(L1, L2, k);
  } else if (t < 10) {
    const k = ease(seg(t, 6, 10));
    const ang = lerp(Math.atan2(P2.x, P2.z), Math.atan2(P2.x, P2.z) - 1.25, k);
    const r = lerp(Math.hypot(P2.x, P2.z), 11, k);
    pos.set(Math.sin(ang) * r, lerp(3.5, 5, k), Math.cos(ang) * r); look.lerpVectors(L2, L3, k);
  } else {
    const k = ease(seg(t, 10, 12.8));
    const a0 = Math.atan2(2, 6.5) - 1.25;
    const ang = lerp(a0, 0, k);
    const r = lerp(11, 12.5, k);
    pos.set(Math.sin(ang) * r, lerp(5, 4.2, k), Math.cos(ang) * r); look.lerpVectors(L3, new THREE.Vector3(0, 4.2, 0), k);
  }
  camera.position.copy(pos); camera.lookAt(look);

  // titles
  const tk = ease(seg(t, 10.2, 11.6)), sk = ease(seg(t, 11.3, 12.5));
  title.material.opacity = tk; title.position.set(0, 5.6 + (1 - tk) * 1.2, 4); title.scale.setScalar(0.85 + 0.15 * tk);
  sub.material.opacity = sk; sub.position.set(0, 3.55 - (1 - sk) * 0.5, 4);
  title.lookAt(camera.position); sub.lookAt(camera.position);
  // dim chart behind titles
  for (const o of [group, tube, head]) { o.position.z = -4 * tk; o.position.y = -1.8 * tk; } arrow.position.z = -4 * tk; arrow.position.y -= 1.8 * tk;

  // fade in/out
  const fade = Math.min(seg(t, 0, 0.6), 1 - seg(t, 13.4, 14));
  renderer.toneMappingExposure = 1.1 * fade;
  composer.render();
};
window.DURATION = DURATION;
window.ready = true;
</script></body></html>
